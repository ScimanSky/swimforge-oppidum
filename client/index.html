<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SwimForge - Social Swimming Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      ;(function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%"
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%"
        // If env vars are not set at build time, Vite leaves placeholders as-is.
        // In that case we skip loading analytics entirely.
        if (!endpoint || endpoint[0] === "%" || !websiteId || websiteId[0] === "%") return

        var s = document.createElement("script")
        s.async = true
        s.defer = true
        s.src = endpoint.replace(/\/$/, "") + "/umami"
        s.setAttribute("data-website-id", websiteId)
        document.head.appendChild(s)
      })()
    </script>
  </body>

</html>
