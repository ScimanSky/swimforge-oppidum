name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Tests
        run: pnpm test
        env:
          GARMIN_SERVICE_SECRET: ci_dummy_secret
          STRAVA_SERVICE_SECRET: ci_dummy_secret
