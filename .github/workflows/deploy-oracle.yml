name: Deploy Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oracle-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          set -euo pipefail
          HOST_RAW="${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          PORT_RAW="${ORACLE_PORT:-22}"
          HOST="$(printf '%s' "$HOST_RAW" | tr -d '\r' | xargs)"
          PORT="$(printf '%s' "$PORT_RAW" | tr -d '\r' | xargs)"
          HOST="${HOST%\"}"
          HOST="${HOST#\"}"
          HOST="${HOST%\'}"
          HOST="${HOST#\'}"
          if [[ -z "$HOST" ]]; then
            echo "ORACLE_HOST is empty after normalization"
            exit 1
          fi
          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "ORACLE_PORT must be numeric"
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy script
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          set -euo pipefail
          HOST_RAW="${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          USER_RAW="${ORACLE_USER:?Missing ORACLE_USER secret}"
          PORT_RAW="${ORACLE_PORT:-22}"
          HOST="$(printf '%s' "$HOST_RAW" | tr -d '\r' | xargs)"
          USER="$(printf '%s' "$USER_RAW" | tr -d '\r' | xargs)"
          PORT="$(printf '%s' "$PORT_RAW" | tr -d '\r' | xargs)"
          HOST="${HOST%\"}"
          HOST="${HOST#\"}"
          HOST="${HOST%\'}"
          HOST="${HOST#\'}"
          USER="${USER%\"}"
          USER="${USER#\"}"
          USER="${USER%\'}"
          USER="${USER#\'}"
          if [[ -z "$HOST" || -z "$USER" ]]; then
            echo "ORACLE_HOST/ORACLE_USER invalid after normalization"
            exit 1
          fi
          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "ORACLE_PORT must be numeric"
            exit 1
          fi

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=20
          ATTEMPT=1

          while true; do
            echo "Remote deploy attempt ${ATTEMPT}/${MAX_ATTEMPTS}"

            set +e
            SSH_OUTPUT="$(
              ssh \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                -p "$PORT" \
                "$USER@$HOST" \
                'if [ -f /home/ubuntu/projects/swimforge-oppidum/deploy/swimforge-deploy.sh ]; then bash /home/ubuntu/projects/swimforge-oppidum/deploy/swimforge-deploy.sh; else /usr/local/bin/swimforge-deploy.sh; fi' 2>&1
            )"
            SSH_EXIT=$?
            set -e

            printf '%s\n' "$SSH_OUTPUT"

            if [[ $SSH_EXIT -eq 0 ]]; then
              echo "Remote deploy completed."
              break
            fi

            if [[ $ATTEMPT -ge $MAX_ATTEMPTS ]]; then
              echo "Remote deploy failed after ${MAX_ATTEMPTS} attempts."
              exit "$SSH_EXIT"
            fi

            if printf '%s' "$SSH_OUTPUT" | grep -qiE 'deploy gia in corso|deploy già in corso|already in progress|flock'; then
              echo "Deploy lock detected on server, waiting ${SLEEP_SECONDS}s before retry."
              ATTEMPT=$((ATTEMPT + 1))
              sleep "$SLEEP_SECONDS"
              continue
            fi

            if printf '%s' "$SSH_OUTPUT" | grep -qiE 'curl: \(22\)|requested URL returned error: 502|502 bad gateway|status.?502'; then
              echo "Transient HTTP 502 during post-deploy readiness check; waiting for service readiness."
              set +e
              RECOVERY_OUTPUT="$(
                ssh \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes \
                  -p "$PORT" \
                  "$USER@$HOST" \
                  'for i in $(seq 1 24); do if curl -fsS http://127.0.0.1/ready >/dev/null 2>&1; then echo "ready"; exit 0; fi; sleep 5; done; echo "not-ready"; exit 1' 2>&1
              )"
              RECOVERY_EXIT=$?
              set -e
              printf '%s\n' "$RECOVERY_OUTPUT"

              if [[ $RECOVERY_EXIT -eq 0 ]]; then
                echo "Service recovered after transient 502. Marking deploy as successful."
                break
              fi

              echo "Service still not ready after wait; retrying full deploy in ${SLEEP_SECONDS}s."
              ATTEMPT=$((ATTEMPT + 1))
              sleep "$SLEEP_SECONDS"
              continue
            fi

            echo "Remote deploy failed for a non-lock reason."
            exit "$SSH_EXIT"
          done
