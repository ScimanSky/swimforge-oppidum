name: Deploy Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oracle-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          set -euo pipefail
          HOST_RAW="${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          PORT_RAW="${ORACLE_PORT:-22}"
          HOST="$(printf '%s' "$HOST_RAW" | tr -d '\r' | xargs)"
          PORT="$(printf '%s' "$PORT_RAW" | tr -d '\r' | xargs)"
          HOST="${HOST%\"}"
          HOST="${HOST#\"}"
          HOST="${HOST%\'}"
          HOST="${HOST#\'}"
          if [[ -z "$HOST" ]]; then
            echo "ORACLE_HOST is empty after normalization"
            exit 1
          fi
          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "ORACLE_PORT must be numeric"
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy script
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          set -euo pipefail
          HOST_RAW="${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          USER_RAW="${ORACLE_USER:?Missing ORACLE_USER secret}"
          PORT_RAW="${ORACLE_PORT:-22}"
          HOST="$(printf '%s' "$HOST_RAW" | tr -d '\r' | xargs)"
          USER="$(printf '%s' "$USER_RAW" | tr -d '\r' | xargs)"
          PORT="$(printf '%s' "$PORT_RAW" | tr -d '\r' | xargs)"
          HOST="${HOST%\"}"
          HOST="${HOST#\"}"
          HOST="${HOST%\'}"
          HOST="${HOST#\'}"
          USER="${USER%\"}"
          USER="${USER#\"}"
          USER="${USER%\'}"
          USER="${USER#\'}"
          if [[ -z "$HOST" || -z "$USER" ]]; then
            echo "ORACLE_HOST/ORACLE_USER invalid after normalization"
            exit 1
          fi
          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "ORACLE_PORT must be numeric"
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            '/usr/local/bin/swimforge-deploy.sh'
